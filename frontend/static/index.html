<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsGuard AI — Zenzo Engine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root[data-theme="dark"] {
    --accent: #38bdf8;
    --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #6366f1 100%);
    --header-bg: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
    --bg: #07090e;
    --card-bg: #111726;
    --card-hover-bg: #161e31;
    --border: rgba(255, 255, 255, 0.08);
    --border-accent: rgba(56, 189, 248, 0.3);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    --input-bg: #0d121f;
    --chip-bg: rgba(17, 24, 39, 0.8);
    --user-bubble-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    --agent-avatar-bg: rgba(6, 182, 212, 0.15);
    --agent-avatar-border: rgba(6, 182, 212, 0.3);
    --agent-avatar-text: #38bdf8;
  }

  :root[data-theme="light"] {
    --accent: #0284c7;
    --accent-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover-bg: #f1f5f9;
    --border: #e2e8f0;
    --border-accent: rgba(2, 132, 199, 0.3);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    --input-bg: #ffffff;
    --chip-bg: #f1f5f9;
    --user-bubble-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
    --agent-avatar-bg: #e0f2fe;
    --agent-avatar-border: #bae6fd;
    --agent-avatar-text: #0284c7;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--header-bg);
    color: #fff;
    padding: 0.85rem 1.4rem;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .brand-logo {
    width: 24px;
    height: 24px;
    background: var(--accent-gradient);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 0.75rem;
    color: #fff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }

  header .badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary);
    backdrop-filter: blur(4px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .icon-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: var(--border-accent);
    transform: translateY(-1px);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    max-width: 90%;
    width: 100%;
    animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; justify-content: flex-end; }
  .msg.agent { align-self: flex-start; justify-content: flex-start; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.75rem;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .msg.user .avatar { background: var(--accent-gradient); color: #fff; }
  .msg.agent .avatar {
    background: var(--agent-avatar-bg);
    color: var(--agent-avatar-text);
    border: 1px solid var(--agent-avatar-border);
  }

  .msg-content { display: flex; flex-direction: column; gap: 0.3rem; max-width: calc(100% - 48px); }
  .msg.user .msg-content { align-items: flex-end; }
  .msg-sender { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-left: 0.2rem; }
  .msg.user .msg-sender { margin-right: 0.2rem; margin-left: 0; }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: #fff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    width: 100%;
    max-width: 100%;
    white-space: normal;
  }

  /* --- Typing / Triage Indicator Animation --- */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.6rem;
  }
  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px var(--accent);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.4rem;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    background: var(--input-bg);
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(6, 182, 212, 0.45);
  }

  .prompts-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.65rem 1.4rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .prompt-btn {
    background: var(--chip-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 1.1rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }
  .prompt-btn:hover {
    background: var(--accent-gradient);
    color: #fff;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
  }

  /* --- A2UI Zenzo Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    max-width: 100%;
    width: 100%;
    animation: cardPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .a2card:hover {
    border-color: var(--border-accent);
  }
  @keyframes cardPop {
    from { transform: scale(0.98); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
    cursor: zoom-in;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid var(--border);
  }
  .a2img:hover {
    transform: scale(1.01);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* --- Lightbox Modal --- */
  .lightbox-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(7, 9, 14, 0.9);
    backdrop-filter: blur(12px);
    align-items: center;
    justify-content: center;
    padding: 2rem;
    animation: fadeIn 0.2s ease;
  }
  .lightbox-modal.active { display: flex; }
  .lightbox-content {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 14px;
    border: 1px solid var(--border-accent);
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 1.5rem; right: 1.5rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 1.5rem;
    width: 42px; height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-logo">Z</div>
    <span>OpsGuard AI</span>
    <span class="badge">Zenzo Engine</span>
    <span class="status-pill"><span class="status-dot"></span> Connected</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="clearChat()" title="Clear chat history">🧹 Clear</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle dark/light mode">☀️ Light</button>
  </div>
</header>

<div id="log"></div>

<div class="prompts-row">
  <button type="button" class="prompt-btn" onclick="sendPrompt('List active incidents and triage severity')">📋 Active Incidents</button>
  <button type="button" class="prompt-btn" onclick="sendPrompt('Analyze Cloud Logging error streams for bugs')">🔍 Analyze Logs</button>
  <button type="button" class="prompt-btn" onclick="sendPrompt('Generate system topology & blast radius diagram')">📊 Topology Diagram</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask OpsGuard AI in plain English…" autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
  <button class="lightbox-close">&times;</button>
  <img class="lightbox-content" id="lightboxImg">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const lightboxModal = document.getElementById("lightboxModal");
const lightboxImg = document.getElementById("lightboxImg");

// Persistent Theme Toggle (Defaults to Zenzo Dark)
function initTheme() {
  const saved = localStorage.getItem("opsguard-theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").textContent = saved === "dark" ? "☀️ Light" : "🌙 Dark";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("opsguard-theme", next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
}
initTheme();

function clearChat() {
  log.innerHTML = "";
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightboxModal.classList.add("active");
}
function closeLightbox() {
  lightboxModal.classList.remove("active");
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const isUser = who === "user";
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", isUser ? "You" : "AI");
  const wrapper = el("div", "msg-content");
  const meta = el("div", "msg-sender", isUser ? "You" : "OpsGuard AI");
  const b = el("div", "bubble");
  
  wrapper.appendChild(meta);
  wrapper.appendChild(b);
  
  if (isUser) {
    m.appendChild(wrapper);
    m.appendChild(avatar);
  } else {
    m.appendChild(avatar);
    m.appendChild(wrapper);
  }
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator(b) {
  b.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  showTypingIndicator(b);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
